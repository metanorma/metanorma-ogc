# The metanorma-ogc CitationStyle instance: the Springer LNCS pack
# with OGC deltas - numeric in-text citations where the citeas stands,
# period-less initials, title-led entries for sources without
# designated creators, and the abbreviated-source title forms.
name: "OGC citation style"
family: lncs
extends: lncs
scheme:
  nameForm:
    initialsPeriod: false
    orgUpcase: false
    completenameUpcase: false
  locale:
    labels:
      no_place: "n.p."
templates:
  name: "{{surname}} {{givenNames}}"
  titleOpen: "<em>"
  titleClose: "</em>"
  # numeric in-text citations: the citeas stands
  citation: ""
  reference: "{{creator}}: {{identifier}}, {{title}}. {{production}} {{dategroup}}. {{location}}"
  uri: "<fmt-link target='{{uri}}'>{{uri}}</fmt-link>"
  uriShort: "<fmt-link target='{{uri}}'>{{uri}}</fmt-link>"
  identifierMode: first
perType:
  - type: report
    template: "{{creator}}: {{citeid}} {{title}}. {{production}} {{dategroup}}. {{location}}"
  - type: monograph
    template: "{{title}}. {{production}} {{dategroup}}. {{location}}"
    fallbacks:
      dategroup: "(n.d.)"
    noPlace: true
  - type: component_part
    template: "{{creator}}: {{title}}. {{componentpart}} {{extent}} {{production}} {{dategroup}}. {{location}}"
  - type: continuing
    template: "{{title}}. {{production}}. {{dategroup}}."
    fallbacks:
      dategroup: "(n.d.)"
  - type: serial_part
    template: "{{creator}}: {{title}}. {{series}} {{extent}} {{dategroup}}. {{location}}"
  - type: online
    template: "{{title}}. {{production}} {{dategroup}}. {{location}}"
    fallbacks:
      dategroup: "(n.d.)"
  - type: webdoc
    template: "{{title}}. {{production}} {{dategroup}}. {{location}}"
    fallbacks:
      dategroup: "(n.d.)"
    title: "<span class='stddocTitle'>{{title}}</span>"
